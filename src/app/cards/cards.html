<div class="card" [ngClass]="{`news` : post.type === `news`, `education` : post.type === `education`, `politic` : post.type === `politic`}">
  <div class="card-header">Post</div>
  <div class="card-body">
    <figure>
      <blockquote class="blockquote">
        <p>{{post.body}}</p>
      </blockquote>
      <p class="title">{{post.title}}</p>
    </figure>

    <ng-content></ng-content> <!--lo metto qui perchè è qui che voglio il button!!!!!-->

  </div>
</div>
